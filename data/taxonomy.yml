# EdTech Research Knowledge Base — taxonomy


evidence_categories:
  efficacy:
    label: "Efficacy"
    guiding_question: "Does the EdTech solution work (in controlled/ideal conditions)?"
    source: "Kucirkova et al. 2025, Table 3"
    tiers:
      1: "Conceptual evidence: a research-grounded theory of change or logic model, backed by a literature review"
      2: "Positive results from a quasi-experimental or correlational study conducted by an independent (third-party) researcher"
      3: "Positive results from an experimental study with a control group and random assignment, conducted by an independent researcher"
  effectiveness:
    label: "Effectiveness"
    guiding_question: "How well does the EdTech solution work in real classroom use?"
    source: "Kucirkova et al. 2025, Table 3"
    tiers:
      1: "Pedagogical evidence: a thorough review of how the product's features align with effective instruction and the relevant national curriculum"
      2: "Positive results from a rigorously designed usability or feasibility study showing contextual and cost fit"
      3: "Positive results from a replication study, including evidence of cost-effectiveness and contextual fit at scale"
  ethics:
    label: "Ethics"
    guiding_question: "How does the EdTech solution handle data, oversight, and accountability?"
    source: "Kucirkova et al. 2025, Table 3"
    tiers:
      1: "Data is processed safely, user privacy follows age-appropriate design, and relevant legislation (e.g. GDPR, COPPA, FERPA) is clearly followed"
      2: "The product supports secure, controlled data exchange/interoperability with other tools"
      3: "Human oversight and accountability are transparently documented across every stage of the product's use and development"
  equity:
    label: "Equity"
    guiding_question: "Who does the EdTech solution work for?"
    source: "Kucirkova et al. 2025, Table 3"
    tiers:
      1: "Design includes inclusive features, shows awareness of bias, and is transparent/accountable in how it engages users"
      2: "Inclusive design adaptable to at least two distinct learner groups, with active bias mitigation"
      3: "Inclusive design accommodating multiple diverse learner groups, anticipates bias, and actively enables equitable implementation"
  environment:
    label: "Environment"
    guiding_question: "Is the EdTech solution and its organisation environmentally sustainable?"
    source: "Kucirkova et al. 2025, Table 3"
    tiers:
      1: "The tool's content and the organisation's public practices show initial steps toward environmental responsibility (e.g. acknowledging responsibilities, basic policies)"
      2: "The organisation takes active steps to promote eco-awareness and takes responsibility for local and broader environmental impact"
      3: "The organisation runs an environmental management system that actively minimises impact and promotes sustainability, locally and more broadly"
  viability:
    label: "Viability (UNVERIFIED — see note above)"
    guiding_question: null
    source: "Listed in the project brief (Section 6); NOT found in Kucirkova et al. 2025 — confirm with Prof. Kucirkova before using"
    tiers: {}

