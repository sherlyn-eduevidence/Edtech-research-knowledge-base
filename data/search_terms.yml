

scope_priority:
  primary_window: "2024-2026"
  expand: "progressively backwards; allow important older/foundational papers"

inclusion_rule: >
  A paper must have meaningful relevance to technology AND
  education/learning/teaching/educational systems. Do not ingest a paper
  merely because it mentions technology in passing.

search_terms:
  - educational technology
  - edtech
  - digital learning
  - technology enhanced learning
  - digital education
  - educational software
  - educational apps
  - adaptive learning
  - intelligent tutoring
  - mobile learning
  - digital reading
  - educational games
  - learning analytics
  - virtual reality education
  - augmented reality education
  - ai education
  - digital assessment
  - learning management systems

sources_to_investigate:
  # Listed per brief Section 8.

  - name: OpenAlex
    verified: false
  - name: Crossref
    verified: false
  - name: DOAJ
    verified: false
  - name: ERIC
    verified: false
  - name: PubMed
    verified: false
    note: "only where relevant to edtech/health-education overlap"
  - name: arXiv
    verified: false
  - name: EdArXiv
    verified: false
  - name: institutional repositories
    verified: false
  - name: publisher open-access articles
    verified: false

geographic_coverage_targets:

  watch_for_underrepresentation:
    - Africa
    - Asia
    - Latin America
    - Middle East
    - low- and middle-income countries
